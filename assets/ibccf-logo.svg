<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" role="img" aria-label="IBCCF — Instituto de Biofísica Carlos Chagas Filho">
  <defs>
    <linearGradient id="ibccfBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#1f5fa6"/>
    </linearGradient>
  </defs>
  <!-- emblema: quadrado arredondado com antena/dish estilizada -->
  <g>
    <rect x="6" y="14" width="120" height="120" rx="14" fill="url(#ibccfBlue)"/>
    <!-- prato/antena -->
    <ellipse cx="52" cy="60" rx="30" ry="20" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(-28 52 60)"/>
    <line x1="52" y1="60" x2="86" y2="92" stroke="#ffffff" stroke-width="4"/>
    <circle cx="52" cy="60" r="5" fill="#ffffff"/>
    <!-- base -->
    <rect x="60" y="92" width="34" height="8" rx="3" fill="#ffffff" transform="rotate(20 77 96)"/>
    <line x1="66" y1="104" x2="100" y2="118" stroke="#ffffff" stroke-width="5"/>
    <line x1="74" y1="116" x2="92" y2="116" stroke="#ffffff" stroke-width="5"/>
  </g>
  <!-- wordmark -->
  <text x="146" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#16335c" letter-spacing="2">IBCCF</text>
  <text x="148" y="104" font-family="'Arial', sans-serif" font-size="16.5" font-weight="600" fill="#1f5fa6" letter-spacing="0.5">INSTITUTO DE BIOFÍSICA</text>
  <text x="148" y="124" font-family="'Arial', sans-serif" font-size="16.5" font-weight="600" fill="#1f5fa6" letter-spacing="0.5">CARLOS CHAGAS FILHO</text>
</svg>
